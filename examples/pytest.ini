[pytest]
# django_app demo: make mysite/ (settings) and polls/ (models) importable, and
# tell pytest-django where the settings live. Without pytest-django loaded the
# DJANGO_SETTINGS_MODULE key is just an unknown ini option, which only earns a
# harmless PytestConfigWarning (no filterwarnings=error here). See django_app/.
pythonpath = django_app
DJANGO_SETTINGS_MODULE = mysite.settings
markers =
    slow: marks tests as slow
    smoke: smoke-test subset
    db: touches a database
    integration: cross-component integration test
    unit: isolated unit test
    security: auth / permission checks
    mpl_image_compare: pytest-mpl figure comparison (see mpl/)
    asyncio: async test, run by pytest-asyncio (see test_async.py)
