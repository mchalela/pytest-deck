[tox]
envlist = style, style-js, docstyle, py{311,312,313,314}-pytest{8,9}, coverage, audit
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run the Python test suite ({envname})
extras = test
# The curated-manifest tests exercise the real plugins and skip when they are
# absent, so the matrix installs them (pytest-mpl is left out: it pulls in
# matplotlib, and its transport is covered with a fake index).
deps =
    pytest8: pytest>=8,<9
    pytest9: pytest>=9,<10
    {[plugins]deps}
passenv =
    PATH
commands =
    pytest {posargs:tests}

[plugins]
deps =
    pytest-cov
    pytest-benchmark
    pytest-metadata
    pytest-mock
    pytest-asyncio
    pytest-django
    django

[testenv:frontend]
description = Install JS deps and build the Svelte bundle into pytest_deck/static
# Node-only env, kept out of the Python matrix. CI runs it before the wheel build
# (docs/INVARIANTS.md, K2).
skip_install = True
deps =
allowlist_externals =
    npm
change_dir = frontend
passenv =
    PATH
    HOME
commands =
    npm ci
    npm run build

[testenv:style]
description = flake8 + black + isort checks
skip_install = True
deps =
    flake8
    flake8-black
    flake8-isort
commands =
    flake8 pytest_deck/ tests/ --max-line-length=88 --ignore=E203,E402,W503 {posargs}

[testenv:coverage]
description = Test-suite coverage over pytest_deck/ (incl. spawned pytest children)
usedevelop = True
extras = test
deps =
    coverage>=7.10
    {[plugins]deps}
passenv =
    PATH
set_env =
    COVERAGE_FILE = {toxinidir}/.coverage
commands =
    coverage erase
    coverage run -m pytest -q tests/ {posargs}
    coverage combine
    coverage report --fail-under=90

[testenv:style-js]
description = prettier + eslint over the frontend (Svelte 5)
skip_install = True
deps =
allowlist_externals =
    npm
change_dir = frontend
passenv =
    PATH
    HOME
commands =
    npm ci
    npm run lint

[testenv:docstyle]
description = pydocstyle over the package
skip_install = True
deps = pydocstyle
commands = pydocstyle pytest_deck --convention=pep257

[testenv:audit]
description = npm audit over the frontend lockfile (fails on high or critical)
# Reads package-lock.json against the advisory DB; no install needed. Loud on
# purpose: an advisory should fail a build, not scroll past inside npm ci.
skip_install = True
deps =
allowlist_externals =
    npm
change_dir = frontend
passenv =
    PATH
    HOME
commands =
    npm audit --audit-level=high
