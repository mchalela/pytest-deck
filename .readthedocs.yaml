# ReadTheDocs build configuration for pytest-deck.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    # Install the package itself (for autodoc imports) plus the docs extra.
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
